spring:
  datasource:
    url: jdbc:h2:mem:taskflow
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

# Secret comes from the JWT_SECRET environment variable.
# The default below is only for local development.
jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-change-me-at-least-32-chars}
  expiration-ms: 86400000
